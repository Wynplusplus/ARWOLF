[package]
name = "wolf3d-bevy"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "A clean-room reimplementation of Wolfenstein 3D in the Bevy game engine"
repository = "https://example.invalid/wolf3d-bevy"

[features]
# The desktop binary is gated behind this feature so that cargo-apk, which
# builds every target in the package, only ever sees the cdylib. It is enabled
# by default so `cargo run` and the Flatpak keep working.
default = ["desktop"]
desktop = []

# A library target is required by cargo-apk (it builds the app as a shared
# object on Android). The desktop binary in src/main.rs calls into it.
[lib]
name = "wolf3d_bevy"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wolf3d-bevy"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
# `android-native-activity` is only meaningful on Android; on desktop it is
# inert. It is enabled so the same feature set is used everywhere.
# `wav` is required because `app::wav_from_i16` wraps the original Wolf3D PCM
# chunks in a WAV container; Bevy's default `audio` feature only enables vorbis.
bevy = { version = "0.19", features = ["android-native-activity", "wav"] }

# JNI is used to request storage access on Android (see `src/android.rs`).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Bevy is slow to compile and run in the default dev profile. The raycaster in
# this crate is CPU bound, so optimise our own code too.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# --- Android packaging (cargo-apk) -------------------------------------------
[package.metadata.android]
package = "io.github.wynplusplus.wolf3dbevy"
apk_name = "wolf3d-bevy"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Strip debug symbols from the shared libraries; without this the debug build
# produces a multi-gigabyte APK.
strip = "strip"

[package.metadata.android.sdk]
target_sdk_version = 33
# bevy_audio (via cpal/AAudio) requires API 26+.
min_sdk_version = 26

[package.metadata.android.application]
label = "ARWOLF"

# The game is designed for a 4:3 landscape view; keep phones in landscape.
[package.metadata.android.application.activity]
orientation = "landscape"

# The in-app folder picker needs to read the user's game folder anywhere on
# shared storage. Android 11+ requires "All files access" (granted by the user
# in system settings); the legacy permission covers older devices.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32
